name: CI

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Work to run against the latest main branch
        required: true
        default: inspection
        type: choice
        options:
          - inspection
          - packages
          - all

permissions:
  contents: read

concurrency:
  group: mish-self-hosted-ci
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  pr-gate:
    name: Fast PR gate
    if: >-
      github.repository == 'Asuka109/mish' &&
      github.repository_id == '1304960811' &&
      github.repository_owner_id == '18379948' &&
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '18379948' &&
      github.triggering_actor == github.actor &&
      github.event.pull_request.base.repo.id == 1304960811 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.id == 1304960811 &&
      github.event.pull_request.head.repo.full_name == 'Asuka109/mish' &&
      github.event.pull_request.head.sha != '' &&
      github.workflow_ref == 'Asuka109/mish/.github/workflows/ci.yml@refs/heads/main' &&
      github.workflow_sha == github.sha
    runs-on: [self-hosted, macOS, ARM64, mish, trusted-ci]
    timeout-minutes: 10
    steps:
      - name: Verify dedicated runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "asuk-mini"
          test "$RUNNER_OS" = "macOS"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(id -u)" -ne 0
          test "$ACTIONS_RUNNER_HOOK_JOB_STARTED:$ACTIONS_RUNNER_HOOK_JOB_COMPLETED" = "$HOME/.local/share/mish-runner-hooks/self-hosted-runner-job-started.sh:$HOME/.local/share/mish-runner-hooks/self-hosted-runner-job-completed.sh"
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run fast pull-request gate
        run: pnpm check:pr

  inspect-main:
    name: Inspect main
    if: >-
      github.repository == 'Asuka109/mish' &&
      github.repository_id == '1304960811' &&
      github.repository_owner_id == '18379948' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'Asuka109/mish/.github/workflows/ci.yml@refs/heads/main' &&
      github.workflow_sha == github.sha &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor_id == '18379948' &&
          github.triggering_actor == github.actor &&
          (inputs.task == 'inspection' || inputs.task == 'all')
        )
      )
    runs-on: [self-hosted, macOS, ARM64, mish, trusted-ci]
    timeout-minutes: 45
    steps:
      - name: Verify dedicated runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "asuk-mini"
          test "$RUNNER_OS" = "macOS"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(id -u)" -ne 0
          test "$ACTIONS_RUNNER_HOOK_JOB_STARTED:$ACTIONS_RUNNER_HOOK_JOB_COMPLETED" = "$HOME/.local/share/mish-runner-hooks/self-hosted-runner-job-started.sh:$HOME/.local/share/mish-runner-hooks/self-hosted-runner-job-completed.sh"
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: main-inspection
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm test:browser:install
      - name: Run complete validation
        run: pnpm check:all
      - name: Run real-browser responsive suite
        run: pnpm test:browser

  package-macos:
    name: Package macOS ARM64
    if: >-
      github.repository == 'Asuka109/mish' &&
      github.repository_id == '1304960811' &&
      github.repository_owner_id == '18379948' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '18379948' &&
      github.triggering_actor == github.actor &&
      github.workflow_ref == 'Asuka109/mish/.github/workflows/ci.yml@refs/heads/main' &&
      github.workflow_sha == github.sha &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.task == 'packages' || inputs.task == 'all')
        )
      )
    runs-on: [self-hosted, macOS, ARM64, mish, trusted-ci]
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify dedicated runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "asuk-mini"
          test "$RUNNER_OS" = "macOS"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(id -u)" -ne 0
          test "$ACTIONS_RUNNER_HOOK_JOB_STARTED:$ACTIONS_RUNNER_HOOK_JOB_COMPLETED" = "$HOME/.local/share/mish-runner-hooks/self-hosted-runner-job-started.sh:$HOME/.local/share/mish-runner-hooks/self-hosted-runner-job-completed.sh"
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: macos-package
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify application bundle
        run: pnpm desktop:build:macos
      - name: Create app archive
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          mkdir -p .scratch/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/macos/Mish.app \
            ".scratch/artifacts/Mish-${short_sha}.app.zip"
          unzip -t ".scratch/artifacts/Mish-${short_sha}.app.zip"
          archive_sha256="$(shasum -a 256 ".scratch/artifacts/Mish-${short_sha}.app.zip" | awk '{print $1}')"
          artifact_name="mish-macos-arm64-${short_sha}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "archive=.scratch/artifacts/Mish-${short_sha}.app.zip" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload Apple Silicon test package
        id: package-upload
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'packages' || inputs.task == 'all'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.revision.outputs.artifact_name }}
          path: ${{ steps.revision.outputs.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Write package summary
        shell: bash
        env:
          ARCHIVE_SHA256: ${{ steps.revision.outputs.archive_sha256 }}
          ARTIFACT_ID: ${{ steps.package-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.revision.outputs.artifact_name }}
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
        run: |
          set -euo pipefail
          {
            echo "## macOS ARM64 test package"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Short SHA | \`$SHORT_SHA\` |"
            echo "| Artifact name | \`$ARTIFACT_NAME\` |"
            echo "| Artifact ID | \`$ARTIFACT_ID\` |"
            echo "| App ID | \`com.asuka109.mish\` |"
            echo "| Architecture | \`arm64\` |"
            echo "| Mihomo version | \`v1.19.29\` |"
            echo "| Release profile | \`alpha-ad-hoc\` |"
            echo "| Signing mode | \`ad-hoc\` |"
            echo "| Notarized | \`no\` |"
            echo "| Archive SHA-256 | \`$ARCHIVE_SHA256\` |"
            echo "| Retention | 14 days |"
          } >> "$GITHUB_STEP_SUMMARY"

  package-android:
    name: Package Android test APKs
    if: >-
      github.repository == 'Asuka109/mish' &&
      github.repository_id == '1304960811' &&
      github.repository_owner_id == '18379948' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '18379948' &&
      github.triggering_actor == github.actor &&
      github.workflow_ref == 'Asuka109/mish/.github/workflows/ci.yml@refs/heads/main' &&
      github.workflow_sha == github.sha &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.task == 'packages' || inputs.task == 'all')
        )
      )
    runs-on: [self-hosted, macOS, ARM64, mish, trusted-ci]
    timeout-minutes: 45
    steps:
      - name: Verify dedicated runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "asuk-mini"
          test "$RUNNER_OS" = "macOS"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(id -u)" -ne 0
          test "$ACTIONS_RUNNER_HOOK_JOB_STARTED:$ACTIONS_RUNNER_HOOK_JOB_COMPLETED" = "$HOME/.local/share/mish-runner-hooks/self-hosted-runner-job-started.sh:$HOME/.local/share/mish-runner-hooks/self-hosted-runner-job-completed.sh"
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/mobile/src-tauri/gen/android/*.gradle*
            apps/mobile/src-tauri/gen/android/**/build.gradle.kts
            apps/mobile/src-tauri/gen/android/**/gradle-wrapper.properties
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 14742923
          log-accepted-android-sdk-licenses: false
          packages: ""
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "platform-tools" \
            "ndk;29.0.14206865"
          rustup target add aarch64-linux-android x86_64-linux-android
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies and Android build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: android-package
          cache-on-failure: true
      - name: Build and stage verified Mobile Core
        run: |
          export ANDROID_NDK_HOME="$NDK_HOME"
          pnpm mobile-core:build
          pnpm mobile-core:verify -- --evidence-dir .scratch/mobile-core/evidence --artifact-dir .scratch/mobile-core/pass-1/android
          pnpm mobile-core:stage:android -- --evidence-dir .scratch/mobile-core/evidence
      - name: Build Android debug APKs
        run: pnpm mobile:android:build
      - name: Verify Android debug APKs
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          output_root="apps/mobile/src-tauri/gen/android/app/build/outputs/apk"
          artifact_root=".scratch/artifacts/android"
          core_checksums=".scratch/mobile-core/evidence/SHA256SUMS"
          mkdir -p "$artifact_root"
          arm64_count=0
          x86_64_count=0
          while IFS= read -r apk; do
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose "$apk"
            entries="$(unzip -Z1 "$apk")"
            if grep -q '^lib/arm64-v8a/' <<< "$entries"; then
              grep -qx 'lib/arm64-v8a/libmish_mobile_core.so' <<< "$entries"
              grep -qx 'lib/arm64-v8a/libmish_vpn_jni.so' <<< "$entries"
              expected_core="$(awk '$2 == "android/arm64-v8a/libmish_mobile_core.so" { print $1 }' "$core_checksums")"
              actual_core="$(unzip -p "$apk" lib/arm64-v8a/libmish_mobile_core.so | shasum -a 256 | awk '{print $1}')"
              test "$actual_core" = "$expected_core"
              cp "$apk" "$artifact_root/Mish-${short_sha}-arm64-v8a-debug.apk"
              arm64_count=$((arm64_count + 1))
            fi
            if grep -q '^lib/x86_64/' <<< "$entries"; then
              grep -qx 'lib/x86_64/libmish_mobile_core.so' <<< "$entries"
              grep -qx 'lib/x86_64/libmish_vpn_jni.so' <<< "$entries"
              expected_core="$(awk '$2 == "android/x86_64/libmish_mobile_core.so" { print $1 }' "$core_checksums")"
              actual_core="$(unzip -p "$apk" lib/x86_64/libmish_mobile_core.so | shasum -a 256 | awk '{print $1}')"
              test "$actual_core" = "$expected_core"
              cp "$apk" "$artifact_root/Mish-${short_sha}-x86_64-debug.apk"
              x86_64_count=$((x86_64_count + 1))
            fi
            if grep -Eqi 'mihomo|subscription|token' <<< "$entries"; then
              echo "APK contains a forbidden runtime or sensitive entry" >&2
              exit 1
            fi
          done < <(find "$output_root" -type f -name '*-debug.apk' -print | sort)
          test "$arm64_count" -eq 1
          test "$x86_64_count" -eq 1
          arm64_sha256="$(shasum -a 256 "$artifact_root/Mish-${short_sha}-arm64-v8a-debug.apk" | awk '{print $1}')"
          x86_64_sha256="$(shasum -a 256 "$artifact_root/Mish-${short_sha}-x86_64-debug.apk" | awk '{print $1}')"
          {
            echo "short_sha=$short_sha"
            echo "artifact_name=mish-android-test-${short_sha}"
            echo "arm64_sha256=$arm64_sha256"
            echo "x86_64_sha256=$x86_64_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload Android non-production test APKs
        id: android-package-upload
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'packages' || inputs.task == 'all'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.revision.outputs.artifact_name }}
          path: .scratch/artifacts/android/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Write Android package summary
        shell: bash
        env:
          ARM64_SHA256: ${{ steps.revision.outputs.arm64_sha256 }}
          ARTIFACT_ID: ${{ steps.android-package-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.revision.outputs.artifact_name }}
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
          X86_64_SHA256: ${{ steps.revision.outputs.x86_64_sha256 }}
        run: |
          {
            echo "## Android non-production test APKs"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Source revision | \`$GITHUB_SHA\` |"
            echo "| Short SHA | \`$SHORT_SHA\` |"
            echo "| Artifact name | \`$ARTIFACT_NAME\` |"
            echo "| Artifact ID | \`$ARTIFACT_ID\` |"
            echo "| App ID | \`com.asuka109.mish\` |"
            echo "| Supported ABIs | \`arm64-v8a\`, \`x86_64\` |"
            echo "| Signing mode | Android debug |"
            echo "| Core | Mihomo v1.19.29 identity probe; VPN lifecycle remains fixture-only |"
            echo "| ARM64 SHA-256 | \`$ARM64_SHA256\` |"
            echo "| x86_64 SHA-256 | \`$X86_64_SHA256\` |"
            echo "| Production use | No |"
            echo "| Retention | 14 days |"
          } >> "$GITHUB_STEP_SUMMARY"
