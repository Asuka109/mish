name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  pr-gate:
    name: Fast PR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run fast pull-request gate
        run: pnpm validate:pr

  inspect-main:
    name: Inspect main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: main-inspection
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm test:browser:install
      - name: Run complete validation
        run: pnpm validate
      - name: Run real-browser responsive suite
        run: pnpm test:browser

  package-macos:
    name: Package macOS ARM64
    # To exercise packaging on PRs later, widen this condition but keep upload main-only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      MISH_APPLE_CERTIFICATE_BASE64: ${{ secrets.MISH_APPLE_CERTIFICATE_BASE64 }}
      MISH_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MISH_APPLE_CERTIFICATE_PASSWORD }}
      MISH_APPLE_SIGNING_IDENTITY: ${{ secrets.MISH_APPLE_SIGNING_IDENTITY }}
      MISH_APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.MISH_APPLE_NOTARY_API_ISSUER_ID }}
      MISH_APPLE_NOTARY_API_KEY_ID: ${{ secrets.MISH_APPLE_NOTARY_API_KEY_ID }}
      MISH_APPLE_NOTARY_API_PRIVATE_KEY: ${{ secrets.MISH_APPLE_NOTARY_API_PRIVATE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-package
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Apple signing
        id: apple-signing
        shell: bash
        run: |
          set -euo pipefail
          values=(
            MISH_APPLE_CERTIFICATE_BASE64
            MISH_APPLE_CERTIFICATE_PASSWORD
            MISH_APPLE_SIGNING_IDENTITY
            MISH_APPLE_NOTARY_API_ISSUER_ID
            MISH_APPLE_NOTARY_API_KEY_ID
            MISH_APPLE_NOTARY_API_PRIVATE_KEY
          )
          present=0
          for name in "${values[@]}"; do
            if [[ -n "${!name}" ]]; then
              present=$((present + 1))
            fi
          done
          if [[ "$present" -ne 0 && "$present" -ne "${#values[@]}" ]]; then
            echo "Apple signing secrets must be configured as one complete set" >&2
            exit 1
          fi
          if [[ "$present" -eq 0 ]]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          command -v trash > /dev/null || brew install trash
          umask 077
          keychain="$RUNNER_TEMP/mish-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/mish-developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${MISH_APPLE_NOTARY_API_KEY_ID}.p8"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MISH_APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$MISH_APPLE_NOTARY_API_PRIVATE_KEY" > "$notary_key"
          chmod 600 "$certificate" "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$MISH_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F -- "\"$MISH_APPLE_SIGNING_IDENTITY\"" > /dev/null
          {
            echo "APPLE_SIGNING_IDENTITY=$MISH_APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$MISH_APPLE_NOTARY_API_ISSUER_ID"
            echo "APPLE_API_KEY=$MISH_APPLE_NOTARY_API_KEY_ID"
            echo "APPLE_API_KEY_PATH=$notary_key"
            echo "MISH_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"
      - name: Build and verify application bundle
        run: pnpm desktop:bundle:macos
      - name: Create app archive
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          mkdir -p .scratch/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/macos/Mish.app \
            ".scratch/artifacts/Mish-${short_sha}.app.zip"
          unzip -t ".scratch/artifacts/Mish-${short_sha}.app.zip"
          archive_sha256="$(shasum -a 256 ".scratch/artifacts/Mish-${short_sha}.app.zip" | awk '{print $1}')"
          artifact_name="mish-macos-arm64-${short_sha}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "archive=.scratch/artifacts/Mish-${short_sha}.app.zip" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload Apple Silicon test package
        id: package-upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.revision.outputs.artifact_name }}
          path: ${{ steps.revision.outputs.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Write package summary
        shell: bash
        env:
          ARCHIVE_SHA256: ${{ steps.revision.outputs.archive_sha256 }}
          ARTIFACT_ID: ${{ steps.package-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.revision.outputs.artifact_name }}
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
          SIGNING_MODE: ${{ steps.apple-signing.outputs.mode }}
        run: |
          set -euo pipefail
          notarized="no"
          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            notarized="yes"
          fi
          {
            echo "## macOS ARM64 test package"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Short SHA | \`$SHORT_SHA\` |"
            echo "| Artifact name | \`$ARTIFACT_NAME\` |"
            echo "| Artifact ID | \`$ARTIFACT_ID\` |"
            echo "| App ID | \`com.asuka109.mish\` |"
            echo "| Architecture | \`arm64\` |"
            echo "| Mihomo version | \`v1.19.29\` |"
            echo "| Signing mode | \`$SIGNING_MODE\` |"
            echo "| Notarized | \`$notarized\` |"
            echo "| Archive SHA-256 | \`$ARCHIVE_SHA256\` |"
            echo "| Retention | 14 days |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${MISH_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MISH_SIGNING_KEYCHAIN" || true
          fi
          find "$RUNNER_TEMP" -maxdepth 1 \
            \( -name 'mish-developer-id.p12' -o -name 'AuthKey_*.p8' \) \
            -exec trash {} + 2>/dev/null || true

  package-android:
    name: Package Android test APKs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/mobile/src-tauri/gen/android/*.gradle*
            apps/mobile/src-tauri/gen/android/**/build.gradle.kts
            apps/mobile/src-tauri/gen/android/**/gradle-wrapper.properties
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "platform-tools" \
            "ndk;29.0.14206865"
          rustup target add aarch64-linux-android x86_64-linux-android
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies and Android build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-package
          cache-on-failure: true
      - name: Build Android debug APKs
        run: pnpm mobile:android:build
      - name: Verify Android debug APKs
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          output_root="apps/mobile/src-tauri/gen/android/app/build/outputs/apk"
          artifact_root=".scratch/artifacts/android"
          mkdir -p "$artifact_root"
          arm64_count=0
          x86_64_count=0
          while IFS= read -r apk; do
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose "$apk"
            entries="$(unzip -Z1 "$apk")"
            if grep -q '^lib/arm64-v8a/' <<< "$entries"; then
              cp "$apk" "$artifact_root/Mish-${short_sha}-arm64-v8a-debug.apk"
              arm64_count=$((arm64_count + 1))
            fi
            if grep -q '^lib/x86_64/' <<< "$entries"; then
              cp "$apk" "$artifact_root/Mish-${short_sha}-x86_64-debug.apk"
              x86_64_count=$((x86_64_count + 1))
            fi
            if grep -Eqi 'mihomo|subscription|token' <<< "$entries"; then
              echo "APK contains a forbidden runtime or sensitive entry" >&2
              exit 1
            fi
          done < <(find "$output_root" -type f -name '*-debug.apk' -print | sort)
          test "$arm64_count" -eq 1
          test "$x86_64_count" -eq 1
          arm64_sha256="$(sha256sum "$artifact_root/Mish-${short_sha}-arm64-v8a-debug.apk" | awk '{print $1}')"
          x86_64_sha256="$(sha256sum "$artifact_root/Mish-${short_sha}-x86_64-debug.apk" | awk '{print $1}')"
          {
            echo "short_sha=$short_sha"
            echo "artifact_name=mish-android-test-${short_sha}"
            echo "arm64_sha256=$arm64_sha256"
            echo "x86_64_sha256=$x86_64_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload Android non-production test APKs
        id: android-package-upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.revision.outputs.artifact_name }}
          path: .scratch/artifacts/android/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Write Android package summary
        shell: bash
        env:
          ARM64_SHA256: ${{ steps.revision.outputs.arm64_sha256 }}
          ARTIFACT_ID: ${{ steps.android-package-upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.revision.outputs.artifact_name }}
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
          X86_64_SHA256: ${{ steps.revision.outputs.x86_64_sha256 }}
        run: |
          {
            echo "## Android non-production test APKs"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Source revision | \`$GITHUB_SHA\` |"
            echo "| Short SHA | \`$SHORT_SHA\` |"
            echo "| Artifact name | \`$ARTIFACT_NAME\` |"
            echo "| Artifact ID | \`$ARTIFACT_ID\` |"
            echo "| App ID | \`com.asuka109.mish\` |"
            echo "| Supported ABIs | \`arm64-v8a\`, \`x86_64\` |"
            echo "| Signing mode | Android debug |"
            echo "| Core | Not included; typed native fixture only |"
            echo "| ARM64 SHA-256 | \`$ARM64_SHA256\` |"
            echo "| x86_64 SHA-256 | \`$X86_64_SHA256\` |"
            echo "| Production use | No |"
            echo "| Retention | 14 days |"
          } >> "$GITHUB_STEP_SUMMARY"
