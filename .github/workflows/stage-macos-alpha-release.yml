name: Validate macOS Release Candidate

run-name: Validate macOS ${{ inputs.profile }} ${{ inputs.version }} (credential-free)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Explicit credential-free profile; never inferred from protected inputs
        required: true
        default: alpha-ad-hoc
        type: choice
        options:
          - alpha-ad-hoc
          - internal-tun-alpha
          - signed-direct
      version:
        description: Prerelease SemVer matching the desktop base version
        required: true
        type: string
      source_sha:
        description: Optional full commit SHA reachable from frozen main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-candidate-${{ inputs.profile }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  freeze-source:
    name: Freeze reviewed source and tooling
    if: >-
      github.repository == 'Asuka109/mish' &&
      github.repository_id == '1304960811' &&
      github.repository_owner_id == '18379948' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '18379948' &&
      github.triggering_actor == github.actor &&
      github.workflow_ref == 'Asuka109/mish/.github/workflows/stage-macos-alpha-release.yml@refs/heads/main' &&
      github.workflow_sha == github.sha
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      base_version: ${{ steps.source.outputs.base_version }}
      candidate_artifact_name: mish-untrusted-alpha-${{ steps.source.outputs.version }}-${{ steps.source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      internal_candidate_artifact_name: mish-internal-tun-alpha-candidate-${{ steps.source.outputs.version }}-${{ steps.source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      internal_stage_artifact_name: mish-internal-tun-alpha-stage-${{ steps.source.outputs.version }}-${{ steps.source.outputs.source_sha }}-${{ github.workflow_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      internal_verification_artifact_name: mish-internal-tun-alpha-verification-${{ steps.source.outputs.version }}-${{ steps.source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      main_sha: ${{ steps.source.outputs.main_sha }}
      profile: ${{ inputs.profile }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
      tooling_sha: ${{ github.workflow_sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out frozen main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
      - name: Confirm workflow and tooling revision
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$WORKFLOW_SHA"
      - name: Resolve exact source and version
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          arguments=(
            resolve
            --version "$RELEASE_VERSION"
            --main-ref HEAD
          )
          if [[ -n "$REQUESTED_SOURCE_SHA" ]]; then
            arguments+=(--source "$REQUESTED_SOURCE_SHA")
          fi
          node scripts/macos-alpha-release.ts "${arguments[@]}"
      - name: Verify trusted dispatch and frozen ancestry
        shell: bash
        env:
          ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TOOLING_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          node scripts/trusted-release-policy.ts verify-dispatch \
            --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --repository-owner-id "$REPOSITORY_OWNER_ID" \
            --event-name "$EVENT_NAME" \
            --ref "$REF_NAME" \
            --actor-id "$ACTOR_ID" \
            --triggering-actor-id "$ACTOR_ID" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --tooling-sha "$TOOLING_SHA" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"
      - name: Require exact frozen main for Internal TUN Alpha
        if: ${{ inputs.profile == 'internal-tun-alpha' }}
        env:
          MAIN_SHA: ${{ steps.source.outputs.main_sha }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          node scripts/internal-tun-alpha-staging.ts assert-request \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$MAIN_SHA"
      - name: Read-only Alpha conflict preflight
        if: ${{ inputs.profile == 'alpha-ad-hoc' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          node scripts/macos-alpha-release.ts plan \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA"
      - name: Read-only signed conflict preflight
        if: ${{ inputs.profile == 'signed-direct' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MISH_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          node scripts/macos-signed-release.ts preflight \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA"

  verify-candidate:
    name: Build untrusted credential-free Alpha candidate
    if: ${{ inputs.profile == 'alpha-ad-hoc' }}
    needs: freeze-source
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
    steps:
      - name: Check out frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.source_sha }}
      - name: Check out frozen release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.tooling_sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: macos-alpha-candidate
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete repository validation
        run: pnpm check:all
      - name: Build and inspect Alpha DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
          GH_TOKEN: ${{ github.token }}
        run: pnpm desktop:bundle:macos
      - name: Generate versioned candidate and release metadata
        env:
          BASE_VERSION: ${{ needs.freeze-source.outputs.base_version }}
          MISH_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}
          RELEASE_VERSION: ${{ needs.freeze-source.outputs.version }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
        run: |
          node .release-tooling/scripts/macos-alpha-release.ts prepare-artifacts \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --dmg "target/release/bundle/dmg/Mish_${BASE_VERSION}_aarch64.dmg" \
            --output-directory target/release-candidate
      - name: Bind candidate files to frozen source and tooling
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ARTIFACT_NAME: ${{ needs.freeze-source.outputs.candidate_artifact_name }}
          MAIN_SHA: ${{ needs.freeze-source.outputs.main_sha }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
        run: |
          node .release-tooling/scripts/trusted-release-policy.ts create-manifest \
            --directory target/release-candidate \
            --kind alpha-ad-hoc-untrusted-candidate \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --actor-id "$ACTOR_ID" \
            --triggering-actor-id "$ACTOR_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --tooling-sha "$TOOLING_SHA" \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$MAIN_SHA" \
            --source-is-ancestor true \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload untrusted credential-free candidate
        id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.freeze-source.outputs.candidate_artifact_name }}
          path: target/release-candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  staging-decision:
    name: Verify immutable Alpha candidate without staging
    if: ${{ inputs.profile == 'alpha-ad-hoc' }}
    needs:
      - freeze-source
      - verify-candidate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.source_sha }}
      - name: Check out frozen release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.tooling_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
      - name: Download exact immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify-candidate.outputs.artifact_id }}
          merge-multiple: true
          path: target/release-candidate
      - name: Verify candidate identity and complete digest set
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ARTIFACT_ID: ${{ needs.verify-candidate.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.freeze-source.outputs.candidate_artifact_name }}
          MAIN_SHA: ${{ needs.freeze-source.outputs.main_sha }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
        run: |
          node .release-tooling/scripts/trusted-release-policy.ts verify-manifest \
            --directory target/release-candidate \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --actor-id "$ACTOR_ID" \
            --triggering-actor-id "$ACTOR_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --tooling-sha "$TOOLING_SHA" \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$MAIN_SHA" \
            --source-is-ancestor true \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Validate Alpha candidate without mutation
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          MISH_RELEASE_REPOSITORY_ROOT: ${{ github.workspace }}
          RELEASE_VERSION: ${{ needs.freeze-source.outputs.version }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
        run: |
          node .release-tooling/scripts/macos-alpha-release.ts plan \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --artifact-directory target/release-candidate
      - name: Write credential-free decision summary
        env:
          ARTIFACT_ID: ${{ needs.verify-candidate.outputs.artifact_id }}
          DECISION: ${{ steps.decision.outputs.action }}
          RELEASE_VERSION: ${{ needs.freeze-source.outputs.version }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
        run: |
          {
            echo "## Credential-free Alpha candidate"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$RELEASE_VERSION\` |"
            echo "| Source SHA | \`$SOURCE_SHA\` |"
            echo "| Workflow/tooling SHA | \`$TOOLING_SHA\` |"
            echo "| Immutable artifact ID | \`$ARTIFACT_ID\` |"
            echo "| Read-only decision | \`$DECISION\` |"
            echo "| Project-trusted release | \`no\` |"
            echo "| Staged or published | \`no\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-internal-tun-candidate:
    name: Build source-bound Internal TUN Alpha DMG candidate
    if: ${{ inputs.profile == 'internal-tun-alpha' }}
    needs: freeze-source
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
    steps:
      - name: Check out frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.source_sha }}
      - name: Check out frozen release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.tooling_sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm test:browser:install
      - name: Run required repository and package policy checks
        run: pnpm check:pr && pnpm test:macos:bundle
      - name: Build accepted Internal TUN Alpha package
        run: pnpm macos:internal-tun-alpha:package
      - name: Build deterministic DMG, SBOM, provenance, and immutable candidate manifest
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ARTIFACT_NAME: ${{ needs.freeze-source.outputs.internal_candidate_artifact_name }}
          MAIN_SHA: ${{ needs.freeze-source.outputs.main_sha }}
          PACKAGE_VERSION: ${{ needs.freeze-source.outputs.version }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
        run: |
          node .release-tooling/scripts/internal-tun-alpha-staging.ts prepare \
            --package-root "$GITHUB_WORKSPACE/target/internal-tun-alpha/Mish-Internal-TUN-Alpha-$PACKAGE_VERSION-arm64" \
            --output-directory "$GITHUB_WORKSPACE/target/internal-tun-alpha-candidate" \
            --source-root "$GITHUB_WORKSPACE" \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --actor-id "$ACTOR_ID" \
            --triggering-actor-id "$ACTOR_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --tooling-sha "$TOOLING_SHA" \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$MAIN_SHA" \
            --source-is-ancestor true \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload immutable-ID-addressed Internal TUN candidate
        id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.freeze-source.outputs.internal_candidate_artifact_name }}
          path: target/internal-tun-alpha-candidate/
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1

  verify-internal-tun-candidate:
    name: Independently verify Internal TUN Alpha candidate read-only
    if: ${{ inputs.profile == 'internal-tun-alpha' }}
    needs:
      - freeze-source
      - build-internal-tun-candidate
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.verification-upload.outputs.artifact-id }}
    steps:
      - name: Check out frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.source_sha }}
      - name: Check out frozen release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.tooling_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
      - name: Download exact immutable Internal TUN candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-internal-tun-candidate.outputs.artifact_id }}
          merge-multiple: true
          path: target/internal-tun-alpha-candidate
      - name: Verify archive, layout, identity, protocol, SBOM, and provenance read-only
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ARTIFACT_ID: ${{ needs.build-internal-tun-candidate.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.freeze-source.outputs.internal_candidate_artifact_name }}
          MAIN_SHA: ${{ needs.freeze-source.outputs.main_sha }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
        run: |
          mkdir -m 700 "$GITHUB_WORKSPACE/target/internal-tun-alpha-verification"
          node .release-tooling/scripts/verify-internal-tun-alpha-stage.ts verify \
            --directory "$GITHUB_WORKSPACE/target/internal-tun-alpha-candidate" \
            --evidence-output "$GITHUB_WORKSPACE/target/internal-tun-alpha-verification/internal-tun-alpha-verification.json" \
            --source-root "$GITHUB_WORKSPACE" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --actor-id "$ACTOR_ID" \
            --triggering-actor-id "$ACTOR_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --tooling-sha "$TOOLING_SHA" \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$MAIN_SHA" \
            --source-is-ancestor true \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload immutable verification evidence
        id: verification-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.freeze-source.outputs.internal_verification_artifact_name }}
          path: target/internal-tun-alpha-verification/
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1

  stage-internal-tun-alpha:
    name: Stage verified immutable Internal TUN Alpha artifact
    if: ${{ inputs.profile == 'internal-tun-alpha' }}
    needs:
      - freeze-source
      - build-internal-tun-candidate
      - verify-internal-tun-candidate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.stage-upload.outputs.artifact-id }}
    steps:
      - name: Check out frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.source_sha }}
      - name: Check out frozen release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.tooling_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
      - name: Download exact candidate by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-internal-tun-candidate.outputs.artifact_id }}
          merge-multiple: true
          path: target/internal-tun-alpha-candidate
      - name: Download exact verification by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify-internal-tun-candidate.outputs.artifact_id }}
          merge-multiple: true
          path: target/internal-tun-alpha-verification
      - name: Bind candidate and verification into one final immutable stage
        env:
          ACTOR_ID: ${{ github.actor_id }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build-internal-tun-candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.freeze-source.outputs.internal_candidate_artifact_name }}
          FINAL_ARTIFACT_NAME: ${{ needs.freeze-source.outputs.internal_stage_artifact_name }}
          MAIN_SHA: ${{ needs.freeze-source.outputs.main_sha }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
          VERIFICATION_ARTIFACT_ID: ${{ needs.verify-internal-tun-candidate.outputs.artifact_id }}
          VERIFICATION_ARTIFACT_NAME: ${{ needs.freeze-source.outputs.internal_verification_artifact_name }}
        run: |
          node .release-tooling/scripts/internal-tun-alpha-staging.ts finalize \
            --candidate-directory "$GITHUB_WORKSPACE/target/internal-tun-alpha-candidate" \
            --verification-directory "$GITHUB_WORKSPACE/target/internal-tun-alpha-verification" \
            --output-directory "$GITHUB_WORKSPACE/target/internal-tun-alpha-stage" \
            --source-root "$GITHUB_WORKSPACE" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-artifact-name "$CANDIDATE_ARTIFACT_NAME" \
            --verification-artifact-id "$VERIFICATION_ARTIFACT_ID" \
            --verification-artifact-name "$VERIFICATION_ARTIFACT_NAME" \
            --final-artifact-name "$FINAL_ARTIFACT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --actor-id "$ACTOR_ID" \
            --triggering-actor-id "$ACTOR_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --tooling-sha "$TOOLING_SHA" \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$MAIN_SHA" \
            --source-is-ancestor true \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload final immutable Internal TUN Alpha stage
        id: stage-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.freeze-source.outputs.internal_stage_artifact_name }}
          path: target/internal-tun-alpha-stage/
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 14

  confirm-internal-tun-stage:
    name: Confirm final Internal TUN Alpha stage read-only
    if: ${{ inputs.profile == 'internal-tun-alpha' }}
    needs:
      - freeze-source
      - stage-internal-tun-alpha
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.source_sha }}
      - name: Check out frozen release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.tooling_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
      - name: Download final stage by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.stage-internal-tun-alpha.outputs.artifact_id }}
          merge-multiple: true
          path: target/internal-tun-alpha-stage
      - name: Reverify final stage and DMG read-only
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ARTIFACT_ID: ${{ needs.stage-internal-tun-alpha.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.freeze-source.outputs.internal_stage_artifact_name }}
          MAIN_SHA: ${{ needs.freeze-source.outputs.main_sha }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
        run: |
          node .release-tooling/scripts/verify-internal-tun-alpha-stage.ts confirm \
            --directory "$GITHUB_WORKSPACE/target/internal-tun-alpha-stage" \
            --source-root "$GITHUB_WORKSPACE" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --actor-id "$ACTOR_ID" \
            --triggering-actor-id "$ACTOR_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --tooling-sha "$TOOLING_SHA" \
            --source-sha "$SOURCE_SHA" \
            --main-sha "$MAIN_SHA" \
            --source-is-ancestor true \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Write successful Internal TUN Alpha staging summary
        env:
          ARTIFACT_ID: ${{ needs.stage-internal-tun-alpha.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.freeze-source.outputs.internal_stage_artifact_name }}
          RELEASE_VERSION: ${{ needs.freeze-source.outputs.version }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
        run: |
          {
            echo "## Immutable Internal TUN Alpha stage"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$RELEASE_VERSION\` |"
            echo "| Source SHA | \`$SOURCE_SHA\` |"
            echo "| Workflow/tooling SHA | \`$TOOLING_SHA\` |"
            echo "| Immutable artifact name | \`$ARTIFACT_NAME\` |"
            echo "| Immutable artifact ID | \`$ARTIFACT_ID\` |"
            echo "| Independent read-only verification | \`passed\` |"
            echo "| Signing / notarization | \`ad-hoc / none\` |"
            echo "| Distribution | \`private Internal TUN Alpha only\` |"
            echo "| Public release or deployment | \`no\` |"
            echo "| Retention | \`14 days\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-signed-plan:
    name: Verify disabled signed-direct contract
    if: ${{ inputs.profile == 'signed-direct' }}
    needs: freeze-source
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.source_sha }}
      - name: Check out frozen release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          path: .release-tooling
          persist-credentials: false
          ref: ${{ needs.freeze-source.outputs.tooling_sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: macos-signed-release-plan
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete repository validation
        run: pnpm check:all
      - name: Validate credential-free signed boundary plan
        env:
          CONTENTS_PERMISSION: read
          EXPECTED_REPOSITORY: ${{ github.repository }}
          RELEASE_ENVIRONMENT: macos-developer-id
          RELEASE_PROFILE: ${{ inputs.profile }}
          RELEASE_VERSION: ${{ needs.freeze-source.outputs.version }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
        run: |
          node .release-tooling/scripts/macos-signed-release.ts plan-boundary \
            --profile "$RELEASE_PROFILE" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --environment "$RELEASE_ENVIRONMENT" \
            --contents-permission "$CONTENTS_PERMISSION" \
            --dry-run true \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA"
      - name: Run adversarial trusted-boundary fixtures
        run: node .release-tooling/scripts/trusted-release-policy.ts fixture
      - name: Verify updater artifact contract fixture
        run: node .release-tooling/scripts/macos-updater-contract.ts fixture
      - name: Write disabled protected-path summary
        env:
          RELEASE_VERSION: ${{ needs.freeze-source.outputs.version }}
          SOURCE_SHA: ${{ needs.freeze-source.outputs.source_sha }}
          TOOLING_SHA: ${{ needs.freeze-source.outputs.tooling_sha }}
        run: |
          {
            echo "## signed-direct credential-free contract"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$RELEASE_VERSION\` |"
            echo "| Source SHA | \`$SOURCE_SHA\` |"
            echo "| Workflow/tooling SHA | \`$TOOLING_SHA\` |"
            echo "| Protected signing / notarization | \`disabled\` |"
            echo "| Attestation / OIDC | \`disabled\` |"
            echo "| Release publication / deployment | \`disabled\` |"
            echo "| Live Apple or release evidence | \`not observed\` |"
          } >> "$GITHUB_STEP_SUMMARY"
