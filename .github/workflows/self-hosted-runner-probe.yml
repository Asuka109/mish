name: Self-hosted runner probe

on:
  push:
    branches:
      - codex/self-hosted-macos-runner

permissions:
  contents: read

concurrency:
  group: mish-self-hosted-ci
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'Asuka109/mish' &&
      github.repository_owner == 'Asuka109' &&
      github.actor == 'Asuka109' &&
      github.ref == 'refs/heads/codex/self-hosted-macos-runner'
    runs-on: [self-hosted, macOS, ARM64, mish, trusted-ci]
    timeout-minutes: 5
    steps:
      - name: Repair the installed hook without using a downloaded action
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          runner_root="${RUNNER_TEMP%/_work/_temp}"
          hook_file="$HOME/.local/share/mish-runner-hooks/self-hosted-runner-hygiene.sh"
          [[ "$GITHUB_WORKSPACE" == "$runner_root/_work/"* ]]
          [[ -f "$hook_file" ]]

          HOOK_FILE="$hook_file" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = process.env.HOOK_FILE;
          const source = readFileSync(path, "utf8");
          const start = source.indexOf("clear_workspace() {");
          const end = source.indexOf("\n}\n\ncleanup()", start);
          if (start < 0 || end < 0) {
            throw new Error("installed cleanup function was not recognized");
          }
          const replacement = `clear_workspace() {
            local directory
            local workspace
            [[ "$work_root" == "$HOME/actions-runner/mish/_work" ]] ||
              fail "refusing to clear an unexpected workspace"

            if [[ "$mode" == "started" ]]; then
              workspace="\${GITHUB_WORKSPACE:-}"
              [[ "$workspace" == "$work_root"/* ]] ||
                fail "GitHub workspace is outside the registered runner work root"
              /bin/mkdir -p "$workspace"
              return
            fi

            for directory in "$work_root/mish" "$work_root/_actions" "$work_root/_temp"; do
              /bin/mkdir -p "$directory"
              /usr/bin/find "$directory" -depth -mindepth 1 -delete
            done
          }`;
          writeFileSync(path, source.slice(0, start) + replacement + source.slice(end + 2), {
            mode: 0o700,
          });
          NODE

          /bin/chmod 700 "$hook_file"
          /bin/bash -n "$hook_file"
          /bin/mkdir -p "$GITHUB_WORKSPACE"
      - name: Inspect the existing runner without exposing local identity
        shell: bash
        run: |
          set -euo pipefail

          [[ "${RUNNER_NAME:-}" == "asuk-mini" ]]
          [[ "${RUNNER_OS:-}" == "macOS" ]]
          [[ "${RUNNER_ARCH:-}" == "ARM64" ]]
          [[ "$(id -u)" -ne 0 ]]

          runner_root="${RUNNER_TEMP%/_work/_temp}"
          [[ "$runner_root" == "$HOME/actions-runner/mish" ]]
          [[ -d "$runner_root/_work" ]]
          [[ -f "$runner_root/.runner" ]]

          console_relation=different
          if [[ "$(/usr/bin/stat -f '%Su' /dev/console)" == "$(id -un)" ]]; then
            console_relation=same
          fi

          listener_process=absent
          listener_parent=absent
          listener_pid="$(/usr/bin/pgrep -f 'Runner.Listener' | /usr/bin/head -n 1 || true)"
          if [[ -n "$listener_pid" ]]; then
            listener_process=present
            listener_parent_pid="$(/bin/ps -p "$listener_pid" -o ppid= | /usr/bin/xargs)"
            if [[ -n "$listener_parent_pid" ]]; then
              listener_parent="$(/bin/ps -p "$listener_parent_pid" -o comm= | /usr/bin/xargs basename)"
            fi
          fi

          service_definition=absent
          service_loaded=absent
          if [[ -f "$runner_root/.service" ]]; then
            service_definition=present
            service_label="$(<"$runner_root/.service")"
            if /bin/launchctl print "gui/$(id -u)/$service_label" >/dev/null 2>&1; then
              service_loaded=present
            fi
          fi

          hook_started=absent
          hook_completed=absent
          if /usr/bin/grep -q '^ACTIONS_RUNNER_HOOK_JOB_STARTED=' "$runner_root/.env" 2>/dev/null; then
            hook_started=present
          fi
          if /usr/bin/grep -q '^ACTIONS_RUNNER_HOOK_JOB_COMPLETED=' "$runner_root/.env" 2>/dev/null; then
            hook_completed=present
          fi

          available_tools=()
          for tool in node pnpm rustup cargo java xcodebuild; do
            if command -v "$tool" >/dev/null; then
              available_tools+=("$tool")
            fi
          done
          android_sdk=absent
          if [[ -d "${ANDROID_HOME:-$HOME/Library/Android/sdk}" ]]; then
            android_sdk=present
          fi

          {
            echo "runner_name=asuk-mini"
            echo "runner_root=~/actions-runner/mish"
            echo "architecture=$(uname -m)"
            echo "console_user_relation=$console_relation"
            echo "listener_process=$listener_process"
            echo "listener_parent=$listener_parent"
            echo "service_definition=$service_definition"
            echo "service_loaded=$service_loaded"
            echo "hook_started=$hook_started"
            echo "hook_completed=$hook_completed"
            echo "android_sdk=$android_sdk"
            printf 'available_tools='
            printf '%s ' "${available_tools[@]}"
            printf '\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Exercise workspace-scoped post-job cleanup
        shell: bash
        run: |
          set -euo pipefail
          runner_root="${RUNNER_TEMP%/_work/_temp}"
          hook_root="$HOME/.local/share/mish-runner-hooks"
          [[ "$runner_root" == "$HOME/actions-runner/mish" ]]
          [[ "$MISH_RUNNER_ROOT" == "$runner_root" ]]
          [[ "$MISH_RUNNER_HOOK_ROOT" == "$hook_root" ]]
          [[ "$ACTIONS_RUNNER_HOOK_JOB_STARTED" == "$hook_root/self-hosted-runner-job-started.sh" ]]
          [[ "$ACTIONS_RUNNER_HOOK_JOB_COMPLETED" == "$hook_root/self-hosted-runner-job-completed.sh" ]]

          /bin/mkdir -p "$runner_root/_work/mish"
          /usr/bin/touch "$runner_root/_work/mish/post-hook-sentinel"
          (
            cd "$runner_root/_work/mish"
            /usr/bin/nohup /usr/bin/env -i \
              HOME="$HOME" \
              PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
              /bin/sleep 300 >/dev/null 2>&1 </dev/null &
          )

          image="$RUNNER_TEMP/mish-post-hook-test.dmg"
          /usr/bin/hdiutil create -quiet -size 4m -fs APFS -volname MishHookTest "$image"
          /usr/bin/hdiutil attach -quiet -readonly -nobrowse -noautoopen "$image"
          echo "post_hook_fixture=armed" >>"$GITHUB_STEP_SUMMARY"
