[package]
name = "mish-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mish-production-tun-helper"
path = "src/bin/mish-production-tun-helper.rs"

[dependencies]
futures-util = "0.3.33"
libc = "0.2.186"
mish-bridge = { path = "../desktop-bridge" }
mish-runtime = { path = "../runtime" }
mish-settings = { path = "../settings" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSImageView", "NSPanel", "NSResponder", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["block2", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSNotification", "NSOperation", "NSObject", "NSProcessInfo", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["SMAppService", "objc2", "objc2-foundation"] }
security-framework = "3.7.0"
system-configuration = "0.7.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["macros", "rt"] }
