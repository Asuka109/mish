[package]
name = "mish-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3.33"
mish-runtime = { path = "../runtime" }
mish-settings = { path = "../settings" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["fs", "io-util", "net", "process", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["block2", "NSNotification", "NSOperation", "NSString", "NSURL"] }
system-configuration = "0.7.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["macros", "rt"] }
