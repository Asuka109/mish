[package]
name = "mish-mihomo-controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1.11.1"
futures-util = "0.3.33"
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.18"
url = "2.5.8"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread"] }
