[package]
name = "mish-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3.33"
mish-runtime = { path = "../runtime" }
mish-mihomo-controller = { path = "../mihomo-controller" }
mish-state-authority = { path = "../state-authority" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["sync"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.25.0"
tokio = { version = "1.53.0", features = ["macros", "rt", "sync"] }
