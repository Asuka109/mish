[package]
name = "mish-updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.33"
libc = "0.2.186"
minisign-verify = "0.2.5"
mish-state-machine = { path = "../state-machine" }
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "rustls", "stream"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.53.0", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.25.0"
tokio = { version = "1.53.0", features = ["test-util"] }
