[package]
name = "mish-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3.33"
mish-presentation-contract = { path = "../presentation-contract" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.0", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt", "time"] }
