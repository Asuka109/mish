[package]
name = "mish-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-correlation = []

[dependencies]
futures-util = "0.3.33"
mish-presentation-contract = { path = "../presentation-contract" }
mish-state-machine = { path = "../state-machine" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.0", features = ["sync", "time"] }
tokio-util = "0.7.18"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt", "test-util", "time"] }
