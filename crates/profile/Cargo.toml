[package]
name = "mish-profile"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_norway = "0.9.42"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["sync", "time"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt"] }
