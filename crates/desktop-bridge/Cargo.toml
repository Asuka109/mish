[package]
name = "mish-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-activation-host = []

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bolt-lite = "0.1.0"
bytes = "1.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.2", features = ["derive"] }
futures-util = "0.3.33"
getrandom = "0.4.3"
libc = "0.2.186"
mish-mihomo-controller = { path = "../mihomo-controller" }
mish-profile = { path = "../profile" }
mish-runtime = { path = "../runtime" }
mish-settings = { path = "../settings" }
mish-state-authority = { path = "../state-authority" }
mish-updater = { path = "../updater" }
nix = { version = "0.31.3", features = ["signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_norway = "0.9.42"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = "0.7.18"
url = "2.5.8"
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "rustls", "stream"] }
regex = "1.12.2"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
bbolt-rs = { version = "1.3.10", features = ["compat"] }
tempfile = "3.25.0"
tokio-tungstenite = "0.30.0"
uuid = { version = "1.24.0", features = ["v4"] }
