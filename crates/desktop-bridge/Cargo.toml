[package]
name = "mish-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.6.2", features = ["derive"] }
futures-util = "0.3.33"
mish-mihomo-controller = { path = "../mihomo-controller" }
mish-profile = { path = "../profile" }
mish-runtime = { path = "../runtime" }
mish-settings = { path = "../settings" }
nix = { version = "0.31.3", features = ["signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_norway = "0.9.42"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.18"
url = "2.5.8"
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "rustls", "stream"] }
regex = "1.12.2"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.25.0"
tokio-tungstenite = "0.30.0"
uuid = { version = "1.24.0", features = ["v4"] }
