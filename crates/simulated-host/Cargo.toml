[package]
name = "mish-simulated-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
scenario-harness = []
android-vpn-scenario = ["dep:tauri-plugin-mish-vpn"]

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
futures-util = "0.3.33"
libc = "0.2.186"
mish-bridge = { path = "../desktop-bridge", features = ["test-activation-host"] }
mish-platform-macos = { path = "../platform-macos" }
mish-profile = { path = "../profile" }
mish-runtime = { path = "../runtime", features = ["test-correlation"] }
mish-settings = { path = "../settings" }
mish-state-authority = { path = "../state-authority" }
mish-state-machine = { path = "../state-machine" }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.25.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = "0.7.18"
tauri-plugin-mish-vpn = { path = "../../apps/mobile/src-tauri/plugins/mish-vpn", optional = true, features = ["simulated-host"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[[bin]]
name = "mish-simulated-host"
path = "src/main.rs"
required-features = ["scenario-harness"]
