[package]
name = "mish-simulated-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
scenario-harness = []

[dependencies]
axum = "0.8.9"
futures-util = "0.3.33"
mish-bridge = { path = "../desktop-bridge", features = ["test-activation-host"] }
mish-profile = { path = "../profile" }
mish-runtime = { path = "../runtime", features = ["test-correlation"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.25.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = "0.7.18"

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[[bin]]
name = "mish-simulated-host"
path = "src/main.rs"
required-features = ["scenario-harness"]
