[package]
name = "mish-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
getrandom = "0.4.3"
mish-bridge = { path = "../../../crates/desktop-bridge" }
mish-profile = { path = "../../../crates/profile" }
mish-platform-macos = { path = "../../../crates/platform-macos" }
mish-native-i18n = { path = "../../../crates/native-i18n" }
mish-presentation-contract = { path = "../../../crates/presentation-contract" }
mish-runtime = { path = "../../../crates/runtime" }
mish-settings = { path = "../../../crates/settings" }
mish-state-authority = { path = "../../../crates/state-authority" }
mish-updater = { path = "../../../crates/updater" }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.5", features = ["devtools", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1.53.0", features = ["macros", "sync"] }
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
development-core-host = ["mish-platform-macos/development-core-host"]
development-window-trigger = ["mish-bridge/development-window-trigger"]

[dev-dependencies]
futures-util = "0.3.31"
tempfile = "3.27.0"
