"$schema" = "schemas/schema.json"

[default]
description = "Allows the Mish mobile shell to use the bounded Android VPN product lifecycle."
permissions = [
  "allow-get-snapshot",
  "allow-register-listener",
  "allow-registerListener",
  "allow-remove-listener",
  "allow-removeListener",
  "allow-request-notification-permission",
  "allow-request-vpn-consent",
  "allow-start",
  "allow-stop",
  "allow-cancel-lifecycle-operation",
  "allow-validate-config",
  "allow-load-config",
  "allow-cancel-config-load",
]
