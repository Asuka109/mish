[package]
name = "tauri-plugin-mish-vpn"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "tauri-plugin-mish-vpn"
build = "build.rs"

[lib]
name = "tauri_plugin_mish_vpn"

[features]
default = ["tauri-runtime"]
# Test-only consumers (the repository SimulatedHost) may replay the real Rust
# LifecycleMachine through a closed semantic transcript. The mobile product
# does not enable this feature.
simulated-host = []
tauri-runtime = ["dep:tauri"]

[dependencies]
mish-runtime = { path = "../../../../../crates/runtime" }
mish-state-machine = { path = "../../../../../crates/state-machine" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", default-features = false, features = [], optional = true }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["sync", "time"] }
tokio-util = "0.7.18"
uuid = { version = "1.24.0", features = ["v4"] }

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
