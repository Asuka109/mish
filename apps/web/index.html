<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fa" />
    <link
      rel="icon"
      href="/brand/mish-app-icon.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/brand/mish-app-icon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/brand/mish-app-icon-32.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/brand/mish-app-icon-dark-32.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/brand/mish-app-icon-180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/brand/mish-icon-outline.svg" as="image" type="image/svg+xml" />
    <title>Mish</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body,
      .startup-placeholder {
        background: #f8f9fa;
      }

      html[data-theme="dark"] body,
      html[data-theme="dark"] .startup-placeholder {
        background: #111113;
      }

      .startup-placeholder {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      .startup-placeholder__mark {
        width: 96px;
        height: 96px;
        opacity: 0.19;
      }
    </style>
    <script>
      (() => {
        let preference = "system";
        try {
          const storedPreference = localStorage.getItem("mish.appearance");
          if (["light", "dark", "system"].includes(storedPreference)) {
            preference = storedPreference;
          }
        } catch {}

        const appearance =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = appearance;
        document.documentElement.style.colorScheme = appearance;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", appearance === "dark" ? "#111113" : "#f8f9fa");
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="startup-placeholder" role="status" aria-label="Mish is loading">
        <img
          class="startup-placeholder__mark"
          src="/brand/mish-icon-outline.svg"
          alt=""
          aria-hidden="true"
        />
      </div>
    </div>
    <script type="module" src="/src/window-startup.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
