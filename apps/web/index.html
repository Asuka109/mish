<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fa" />
    <link
      rel="icon"
      href="/brand/mish-app-icon.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/brand/mish-app-icon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/brand/mish-app-icon-32.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/brand/mish-app-icon-dark-32.png"
      sizes="32x32"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/brand/mish-app-icon-180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mish</title>
    <script>
      (() => {
        let preference = "system";
        try {
          const storedPreference = localStorage.getItem("mish.appearance");
          if (["light", "dark", "system"].includes(storedPreference)) {
            preference = storedPreference;
          }
        } catch {}

        const appearance =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = appearance;
        document.documentElement.style.colorScheme = appearance;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", appearance === "dark" ? "#111113" : "#f8f9fa");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
